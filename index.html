<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EGYPT AI HUB PREMIUM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b 0%, #090d16 60%, #000000 100%);
            background-attachment: fixed;
        }

        /* Эффект стекла (Premium Cyberpunk) */
        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 30px rgba(79, 70, 229, 0.15);
        }

        .pulsing-text {
            animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        .title-glow {
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 0 0 30px rgba(99, 102, 241, 0.4);
        }

        /* Кнопки игр */
        .game-btn {
            border: 1px solid rgba(255, 255, 255, 0.07);
            background: rgba(31, 41, 55, 0.8);
            transition: all 0.25s ease;
        }
        .active-game-btn {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border-color: #a78bfa;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            transform: translateY(-2px);
        }

        /* Радар-анимация из прошлого дизайна */
        .radar-ring {
            position: absolute;
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 50%;
            animation: ping-slow 3s cubic-bezier(0, 0, 0.2, 1) infinite;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        @keyframes ping-slow {
            0% { width: 0; height: 0; opacity: 1; }
            75%, 100% { width: 250px; height: 250px; opacity: 0; }
        }

        .chat-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 10px;
        }

        .flag-text {
            display: inline-flex;
            align-items: center;
            line-height: 1;
            direction: ltr; 
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .chat-msg {
            animation: slideIn 0.3s ease-out forwards;
        }

        /* Свечение EGYPT как в сломанном предикторе */
        .pt-glow {
            color: #111827;
            -webkit-text-stroke: 1.5px #eab308;
            text-shadow: 0 0 12px rgba(234, 179, 8, 0.5);
        }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md glass-panel rounded-3xl p-6 sm:p-8 relative overflow-hidden">
        
        <!-- Верхний статус-бар (Онлайн + Пинг) -->
        <div class="flex items-center justify-between bg-gray-900/80 border border-gray-800 rounded-full px-4 py-1.5 mb-5 text-xs">
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                </span>
                <span class="text-gray-300 font-semibold">سيرفر مصر: <span class="text-emerald-400">متصل</span></span>
            </div>
            <div class="text-gray-400 transition-transform duration-200" id="online-container">
                نشط الآن: <span id="online-count" class="text-white font-bold">42</span>
            </div>
        </div>

        <!-- Заголовок -->
        <div class="text-center mb-6">
            <h1 class="font-black tracking-wide flex flex-col items-center justify-center">
                <div class="flag-text text-5xl tracking-tighter mb-1">
                    <span style="color: #CE1126; text-shadow: 0 0 15px rgba(206,17,38,0.5);">EG</span><span style="color: #FFFFFF; text-shadow: 0 0 15px rgba(255,255,255,0.4);">Y</span><span class="pt-glow">PT</span>
                </div>
                <div class="inline-flex items-center gap-1.5 bg-cyan-950/80 border border-cyan-500/30 px-3 py-0.5 rounded-md mt-1 shadow-[0_0_15px_rgba(34,211,238,0.2)]">
                    <span class="text-cyan-400 text-xs">⚡</span>
                    <span class="text-cyan-300 font-bold text-sm tracking-widest uppercase">AI HUB SYSTEM</span>
                </div>
            </h1>
        </div>
        
        <div id="auth-section" class="mb-6 space-y-4 bg-gray-900/60 p-5 rounded-2xl border border-gray-800 relative z-10 shadow-inner">
            <p class="text-gray-300 text-sm text-center font-semibold">
                اكتب المعرّف (ID) بتاعك عشان تربط الحساب بالبرنامج
            </p>
            <div class="relative">
                <input id="player-id-input" type="text" inputmode="numeric" placeholder="مثال: 1048593021" class="w-full bg-gray-800/90 border border-gray-600 text-white rounded-xl px-4 py-3.5 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 text-right font-bold tracking-wider placeholder:font-normal placeholder:text-gray-500 transition-all">
                <div class="absolute left-4 top-3.5 text-gray-500">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-person-badge" viewBox="0 0 16 16"><path d="M6.5 2a.5.5 0 0 0 0 1h3a.5.5 0 0 0 0-1h-3zM11 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/><path d="M4.5 0A2.5 2.5 0 0 0 2 2.5V14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V2.5A2.5 2.5 0 0 0 11.5 0h-7zM3 2.5A1.5 1.5 0 0 1 4.5 1h7A1.5 1.5 0 0 1 13 2.5v10.795a4.2 4.2 0 0 0-.776-.492C11.392 12.387 10.063 12 8 12s-3.392.387-4.224.803a4.2 4.2 0 0 0-.776.492V2.5z"/></svg>
                </div>
            </div>
            <button id="connect-btn" class="w-full bg-gradient-to-r from-teal-500 to-emerald-600 hover:from-teal-600 hover:to-emerald-700 text-white font-black py-3.5 px-6 rounded-xl transition-all duration-300 shadow-lg shadow-emerald-900/40 flex items-center justify-center gap-2">
                <span>اتصال وتفعيل البوت</span>
            </button>
        </div>
        
        <div id="predictor-controls" class="hidden opacity-0 transition-opacity duration-700">
            <!-- Выбор игры -->
            <div class="mb-5">
                <div class="flex items-center justify-between mb-2.5">
                    <h2 class="text-sm font-bold text-gray-300">اختار اللعبة:</h2>
                    <span class="text-xs text-indigo-400 font-semibold">نسبة النجاح: 96.4%</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button id="aviator-btn" class="game-btn active-game-btn flex items-center justify-center gap-2 w-full py-3 px-2 rounded-xl font-bold text-sm">
                        <span>✈️</span> <span>Aviator</span>
                    </button>
                    <button id="apple-btn" class="game-btn flex items-center justify-center gap-2 w-full py-3 px-2 rounded-xl font-bold text-sm text-gray-300">
                        <span>🍏</span> <span>Apple</span>
                    </button>
                    <button id="mines-btn" class="game-btn flex items-center justify-center gap-2 w-full py-3 px-2 rounded-xl font-bold text-sm text-gray-300">
                        <span>💣</span> <span>Mines</span>
                    </button>
                    <button id="penalty-btn" class="game-btn flex items-center justify-center gap-2 w-full py-3 px-2 rounded-xl font-bold text-sm text-gray-300">
                        <span>⚽</span> <span>Penalty</span>
                    </button>
                </div>
            </div>

            <!-- Экран сигнала -->
            <div id="signal-display" class="relative overflow-hidden bg-gray-950/90 min-h-[220px] rounded-2xl p-6 flex flex-col items-center justify-center text-center border border-indigo-500/30 shadow-[inset_0_0_20px_rgba(79,70,229,0.15)]">
                <!-- Сетка фона -->
                <div class="absolute inset-0 opacity-10" style="background-image: linear-gradient(#4f46e5 1px, transparent 1px), linear-gradient(90deg, #4f46e5 1px, transparent 1px); background-size: 20px 20px;"></div>
                
                <!-- Анимация радара (крутится всегда на фоне) -->
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-40">
                    <div class="radar-ring" style="animation-delay: 0s;"></div>
                    <div class="radar-ring" style="animation-delay: 1.5s;"></div>
                </div>
                
                <!-- Сам сигнал -->
                <div class="relative z-10 w-full flex justify-center items-center">
                    <p id="signal-text" class="text-gray-300 text-lg font-medium animate-pulse">
                        الرادار جاهز للتشغيل...
                    </p>
                </div>
            </div>

            <!-- Кнопка генерации -->
            <div class="mt-5">
                <button id="generate-signal-btn" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-black py-4 px-6 rounded-xl transition-all duration-300 transform active:scale-95 shadow-lg shadow-indigo-500/30 uppercase tracking-wider text-base">
                    الحصول على إشارة الآن 🎯
                </button>
            </div>

            <div class="mt-6 mb-2">
                <div class="flex items-center justify-between mb-2 px-1">
                    <h3 class="text-xs font-bold text-cyan-300 tracking-wide uppercase flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse shadow-[0_0_8px_rgba(34,211,238,0.8)]"></span>
                        شات اللاعبين
                    </h3>
                    <span class="text-[10px] text-gray-300 font-bold bg-indigo-900/60 border border-indigo-500/30 px-2 py-0.5 rounded-md">Live</span>
                </div>
                
                <div id="chat-window" class="h-40 bg-gray-900/60 rounded-xl border border-gray-700/50 p-3 overflow-y-auto chat-scroll flex flex-col gap-2 relative shadow-inner">
                    <div class="text-center text-[10px] text-gray-500 font-semibold my-2">-- بداية المحادثة --</div>
                </div>

                <div class="mt-2 flex gap-2">
                    <input id="chat-input" type="text" placeholder="اكتب رسالة..." class="flex-1 bg-gray-800/80 border border-gray-700 rounded-lg px-3 py-2 text-xs text-right text-white focus:border-cyan-500 focus:outline-none">
                    <button id="send-chat-btn" class="bg-cyan-600 hover:bg-cyan-500 text-white p-2 rounded-lg transition-colors shadow-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Целевые кнопки -->
        <div class="mt-6 grid grid-cols-2 gap-3 pt-4 border-t border-gray-800/80">
            <a href="https://reffpa.com/L?tag=d_5434769m_18607c_&site=5434769&ad=18607&r=registration" target="_blank" class="bg-gray-800/50 hover:bg-emerald-500/20 text-white font-bold py-3.5 px-2 rounded-xl transition-all duration-300 text-center flex flex-col items-center justify-center gap-1.5 border border-gray-700 hover:border-emerald-500/50 group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="text-emerald-400 group-hover:text-emerald-300 transition-colors" viewBox="0 0 16 16"><path d="M12.136.326A1.5 1.5 0 0 1 14 1.78V3h.5A1.5 1.5 0 0 1 16 4.5v7a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 11.5v-7A1.5 1.5 0 0 1 1.5 3H2V1.78a1.5 1.5 0 0 1 1.864-1.454l1.714.286a.5.5 0 0 1 .42.495V3h4.5V1.78a.5.5 0 0 1 .42-.495l1.714-.286zM1 4.5a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .5.5h14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.5-.5H1z"/><path d="M13 5.5a.5.5 0 0 1 .5.5v3a.5.5 0 0 1-1 0v-3a.5.5 0 0 1 .5-.5z"/></svg>
                <span class="text-xs">شحن الرصيد</span>
            </a>
            <a href="https://t.me/tarekfawbot" target="_blank" class="bg-gray-800/50 hover:bg-sky-500/20 text-white font-bold py-3.5 px-2 rounded-xl transition-all duration-300 text-center flex flex-col items-center justify-center gap-1.5 border border-gray-700 hover:border-sky-500/50 group">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="text-sky-400 group-hover:text-sky-300 transition-colors" viewBox="0 0 16 16">
                    <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM8.287 5.906c-.778.324-2.334.994-4.666 2.01-.378.15-.577.298-.595.442-.03.243.275.339.69.47l.175.055c.408.133.958.288 1.243.294.26.006.549-.1.868-.32 2.179-1.471 3.304-2.214 3.374-2.23.05-.012.12-.026.166.016.047.041.042.12.037.141-.03.129-1.227 1.241-1.846 1.817-.193.18-.33.307-.358.336a8.154 8.154 0 0 1-.188.186c-.38.366-.664.64.015 1.088.327.216.589.393.85.571.284.194.568.387.936.629.093.06.183.125.27.187.331.226.63.42.996.635.62.395.86.205.975-.258a1.06 1.06 0 0 0 .117-.517c.07-.414.159-1.185.159-1.185s.012-.11.117-.375c.05-.13.11-.253.185-.344l.016-.02c.16-.245.4-.557.4-.557s.078-.08.18-.184c.101-.104.18-.184.18-.184s.078-.08.114-.133c.038-.053.075-.104.11-.16B.03 8.35 15.22 4.223.865 3.312c-.775-.45-1.48-.18-1.76.193s-.255.935-.255.935l-3.328 3.328c-.283.283-.56.565-.56.565s-.182.173-.32.32c-.138.147-.286.295-.286.295l-1.05 1.05c-.282.282-.563.565-.563.565s-.182.173-.32.32c-.137.146-.285.294-.285.294l-2.078 2.078c-.282.282-.563.565-.563.565s-.182.173-.32.32c-.137.146-.285.294-.285.294l-2.078 2.078c-.282.282-.563.565-.563.565s-.182.173-.32.32c-.137.146-.285.294-.285.294L8.287 5.906z"/>
                </svg>
                <span class="text-xs">تواصل مع طارق</span>
            </a>
        </div>

        <div class="mt-5 text-center">
            <p class="text-[10px] text-gray-500 font-mono tracking-widest opacity-60">
                &copy; 2026 EGYPT AI HUB SYSTEM
            </p>
        </div>
    </div>

    <script>
        // --- ПЕРЕМЕННЫЕ ---
        const connectBtn = document.getElementById('connect-btn');
        const playerIdInput = document.getElementById('player-id-input');
        const predictorControls = document.getElementById('predictor-controls');
        const authSection = document.getElementById('auth-section');
        const generateSignalBtn = document.getElementById('generate-signal-btn');
        const signalText = document.getElementById('signal-text');
        
        // Чат и Онлайн
        const onlineContainer = document.getElementById('online-container');
        const onlineCountElement = document.getElementById('online-count');
        const chatWindow = document.getElementById('chat-window');
        const chatInput = document.getElementById('chat-input');
        const sendChatBtn = document.getElementById('send-chat-btn');

        let selectedGame = 'aviator';
        let isGenerating = false;

        // --- ЛОГИКА ОНЛАЙНА ---
        // Начальное значение
        let currentOnline = 1428; 
        
        function updateOnlineCount() {
            // Случайное изменение от -3 до +3
            const change = Math.floor(Math.random() * 7) - 3;
            currentOnline += change;

            // Держим в рамках (использую твои старые рамки для логики, но умноженные для массовости, либо оставлю как было)
            if (currentOnline < 1400) currentOnline = 1400 + Math.floor(Math.random() * 15);
            if (currentOnline > 1460) currentOnline = 1460 - Math.floor(Math.random() * 15);

            onlineCountElement.textContent = currentOnline;
            onlineContainer.classList.add('scale-105');
            setTimeout(() => onlineContainer.classList.remove('scale-105'), 200);
        }
        
        // Обновляем каждые 2.5 секунды
        setInterval(updateOnlineCount, 2500);


        // --- ЛОГИКА ЧАТА ---
        const fakeNames = ["أحمد م.", "كريم س.", "محمد ع.", "يوسف ح.", "مصطفى ك.", "علي ب.", "عمر ط."];
        const fakeMessages = [
            "يا جماعة البرنامج ده نار 🔥",
            "لسه كسبان 500 جنيه في افياتور!",
            "حد جرب الماينز؟ النتايج حلوة النهاردة",
            "ألف شكر يا باشا على البرنامج",
            "توقعات ضربات الجزاء ممتازة",
            "الحمد لله عوضت خسارتي كلها",
            "استنوا شوية قبل ما تلعبوا تاني",
            "أنا سحبت فلوسي خلاص، كفاية كده النهاردة 😄",
            "عاش يا رجالة"
        ];

        function addChatMessage(name, text, isUser = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `chat-msg flex flex-col ${isUser ? 'items-start' : 'items-end'}`;
            
            const bubbleColor = isUser ? 'bg-cyan-600/30 border-cyan-500/50' : 'bg-gray-700/40 border-gray-600/30';
            const nameColor = isUser ? 'text-cyan-300' : 'text-gray-400';

            msgDiv.innerHTML = `
                <div class="max-w-[85%] ${bubbleColor} border rounded-lg px-3 py-1.5 backdrop-blur-sm">
                    <span class="text-[10px] ${nameColor} font-bold mb-0.5 block text-right">${name}</span>
                    <p class="text-xs text-white text-right leading-relaxed">${text}</p>
                </div>
            `;
            
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight; // Автопрокрутка вниз
        }

        // Стартовые сообщения
        setTimeout(() => addChatMessage(fakeNames[0], fakeMessages[0]), 500);
        setTimeout(() => addChatMessage(fakeNames[1], fakeMessages[1]), 1500);

        // Бот пишет каждые 4-7 секунд
        function botChatLoop() {
            const randomDelay = Math.floor(Math.random() * 3000) + 4000;
            setTimeout(() => {
                const rName = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                const rMsg = fakeMessages[Math.floor(Math.random() * fakeMessages.length)];
                addChatMessage(rName, rMsg);
                botChatLoop();
            }, randomDelay);
        }
        botChatLoop();

        // Отправка сообщения пользователем
        function sendMessage() {
            const text = chatInput.value.trim();
            if (text) {
                addChatMessage("أنا (Admin)", text, true);
                chatInput.value = '';
            }
        }
        
        sendChatBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });


        // --- ЛОГИКА ИГРЫ (ПРЕДИКТОРА) ---
        
        // Переключение игр
        const gameButtons = document.querySelectorAll('.game-btn');
        gameButtons.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Убираем активный класс у всех
                gameButtons.forEach(b => {
                    b.classList.remove('active-game-btn');
                    b.classList.add('text-gray-300');
                });
                // Добавляем нажатой
                const target = e.currentTarget;
                target.classList.add('active-game-btn');
                target.classList.remove('text-gray-300');
                selectedGame = target.id.replace('-btn', '');
            });
        });

        // АВТОРИЗАЦИЯ
        connectBtn.addEventListener('click', () => {
            const playerId = playerIdInput.value.trim();
            const idRegex = /^\d{9,13}$/; // Сделал от 9 до 13 цифр для надежности

            if (!idRegex.test(playerId)) {
                playerIdInput.classList.add('border-red-500', 'bg-red-900/20');
                setTimeout(() => playerIdInput.classList.remove('border-red-500', 'bg-red-900/20'), 2000);
                return;
            }

            connectBtn.disabled = true;
            connectBtn.innerHTML = '<span class="animate-spin inline-block mr-2 text-xl">↻</span> جاري الاتصال...';

            setTimeout(() => {
                // Скрываем авторизацию
                authSection.style.display = 'none';
                
                // Показываем интерфейс
                predictorControls.classList.remove('hidden');
                // Небольшая задержка для плавности анимации opacity
                setTimeout(() => predictorControls.classList.remove('opacity-0'), 50);
            }, 1500);
        });

        // ГЕНЕРАЦИЯ СИГНАЛОВ
        generateSignalBtn.addEventListener('click', () => {
            if (isGenerating) return;
            isGenerating = true;
            
            generateSignalBtn.disabled = true;
            generateSignalBtn.classList.add('opacity-75', 'cursor-not-allowed');
            signalText.innerHTML = '<span class="pulsing-text text-amber-400">جاري فحص الخوارزميات...</span>';

            setTimeout(() => {
                let resultHTML = '';
                
                if (selectedGame === 'aviator') {
                    const chance = Math.random();
                    let coeff;
                    if (chance < 0.75) coeff = (Math.random() * (2.00 - 1.01) + 1.01).toFixed(2);
                    else if (chance < 0.95) coeff = (Math.random() * (4.00 - 2.01) + 2.01).toFixed(2);
                    else coeff = (Math.random() * (10.00 - 4.01) + 4.01).toFixed(2);
                    
                    resultHTML = `
                        <div class="flex flex-col items-center">
                            <span class="text-gray-400 text-xs mb-1 font-bold">الهدف المتوقع</span>
                            <span class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-purple-400 to-indigo-500" style="filter: drop-shadow(0 0 15px rgba(139,92,246,0.6))">x${coeff}</span>
                        </div>`;
                } 
                else if (selectedGame === 'mines') {
                    const safeCells = new Set();
                    while (safeCells.size < 5) safeCells.add(Math.floor(Math.random() * 25) + 1);
                    
                    let grid = '<div class="grid grid-cols-5 gap-2 relative z-10 bg-gray-900/50 p-3 rounded-xl border border-gray-700">';
                    for(let i=1; i<=25; i++) {
                        const isSafe = safeCells.has(i);
                        grid += `<div class="w-8 h-8 rounded bg-gray-800 flex items-center justify-center border border-gray-700 ${isSafe ? 'border-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.5)]' : ''}">
                                    ${isSafe ? '<span class="text-emerald-400 text-sm">⭐</span>' : ''}
                                 </div>`;
                    }
                    grid += '</div>';
                    resultHTML = grid;
                }
                else if (selectedGame === 'penalty') {
                    const target = Math.floor(Math.random() * 15) + 1;
                    let grid = '<div class="grid grid-cols-5 gap-2 relative z-10 bg-gray-900/50 p-3 rounded-xl border border-gray-700">';
                    for(let i=1; i<=15; i++) {
                        const isTarget = i === target;
                        grid += `<div class="w-8 h-8 rounded bg-gray-800 flex items-center justify-center border border-gray-700 ${isTarget ? 'bg-green-500/20 border-green-500 shadow-[0_0_15px_rgba(34,197,94,0.6)]' : ''}">
                                    ${isTarget ? '⚽' : ''}
                                 </div>`;
                    }
                    grid += '</div>';
                    resultHTML = grid;
                }
                else if (selectedGame === 'apple') {
                    const safePath = [];
                    for(let i=0; i<10; i++) safePath.push(Math.floor(Math.random() * 5));
                    
                    // Показываем только последние 4 ряда для экономии места
                    let grid = '<div class="grid grid-cols-5 gap-1.5 relative z-10 bg-gray-900/50 p-3 rounded-xl border border-gray-700">';
                    for(let r=3; r>=0; r--) {
                        for(let c=0; c<5; c++) {
                            const isSafe = c === safePath[r];
                            grid += `<div class="w-7 h-7 rounded bg-gray-800 flex items-center justify-center border border-gray-700 ${isSafe ? 'border-rose-500 bg-rose-500/20 shadow-[0_0_10px_rgba(244,63,94,0.4)]' : ''}">
                                        ${isSafe ? '<span class="text-xs">🍎</span>' : '<span class="opacity-10 text-[10px]">?</span>'}
                                     </div>`;
                        }
                    }
                    grid += '</div>';
                     resultHTML = `
                        <div class="flex flex-col items-center">
                            <span class="text-gray-400 text-[10px] mb-2 font-bold bg-gray-900 px-3 py-1 rounded-full border border-gray-700">المسار الآمن (آخر 4 خطوات)</span>
                            ${grid}
                        </div>`;
                }

                signalText.innerHTML = resultHTML;
                isGenerating = false;
                generateSignalBtn.disabled = false;
                generateSignalBtn.classList.remove('opacity-75', 'cursor-not-allowed');
            }, 2000);
        });

    </script>
</body>
</html>
